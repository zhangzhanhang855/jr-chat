<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord 多频道同步终端</title>
    <style>
        :root {
            --bg-darker: #1e1f22;
            --bg-medium: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --brand: #5865f2;
            --text-white: #ffffff;
            --text-gray: #b5bac1;
            --active-item: rgba(255,255,255,0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Noto Sans', sans-serif; }
        body { background-color: var(--bg-darker); overflow: hidden; height: 100vh; width: 100vw; color: var(--text-white); }

        /* 布局控制 */
        .sidebar-servers { position: absolute; left: 0; top: 0; bottom: 0; width: 72px; background: var(--bg-darker); display: flex; flex-direction: column; items: center; padding-top: 12px; z-index: 30; }
        .sidebar-channels { position: absolute; left: 72px; top: 0; bottom: 0; width: 240px; background: var(--bg-medium); display: flex; flex-direction: column; z-index: 20; border-top-left-radius: 8px; }
        .main-chat { position: absolute; left: 312px; right: 0; top: 0; bottom: 0; background: var(--bg-chat); display: flex; flex-direction: column; z-index: 10; }

        .server-icon { width: 48px; height: 48px; background: var(--brand); border-radius: 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: 0.2s; }
        
        .channel-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.2); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .channel-list { flex: 1; padding: 12px 8px; overflow-y: auto; }
        .channel-category { font-size: 11px; font-weight: 700; color: #949ba4; text-transform: uppercase; padding: 0 8px 4px; letter-spacing: 0.2px; }
        
        .channel-item { padding: 6px 8px; border-radius: 4px; color: var(--text-gray); display: flex; align-items: center; cursor: pointer; font-size: 14px; margin-bottom: 2px; transition: 0.1s; }
        .channel-item:hover { background: rgba(255,255,255,0.03); color: #dbdee1; }
        .channel-item.active { background: var(--active-item); color: white; }
        .channel-item span.hash { font-size: 20px; margin-right: 6px; color: #80848e; font-weight: 300; }

        .profile-bar { height: 52px; background: #232428; display: flex; align-items: center; padding: 0 8px; }
        .avatar { width: 32px; height: 32px; background: var(--brand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; flex-shrink: 0; }

        .chat-header { height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(0,0,0,0.2); box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-weight: 600; }
        .chat-scroller { flex: 1; overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
        .chat-scroller::-webkit-scrollbar { width: 8px; }
        .chat-scroller::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }

        .msg-group { display: flex; margin-bottom: 16px; transition: background 0.1s; padding: 2px 4px; border-radius: 4px; }
        .msg-group:hover { background: rgba(0,0,0,0.02); }
        .msg-body { margin-left: 14px; flex: 1; }
        .msg-meta { margin-bottom: 2px; }
        .msg-user { color: white; font-weight: 500; font-size: 14px; margin-right: 6px; cursor: pointer; }
        .msg-user:hover { text-decoration: underline; }
        .msg-time { color: var(--text-gray); font-size: 10px; }
        .msg-text { color: #dbdee1; font-size: 14px; white-space: pre-wrap; line-height: 1.3; }

        .input-wrapper { padding: 0 16px 24px; }
        .input-field { background: var(--bg-input); border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; }
        .input-field input { background: transparent; border: none; color: #dbdee1; outline: none; flex: 1; font-size: 14px; }
        .btn-send { background: var(--brand); border: none; color: white; padding: 6px 14px; border-radius: 3px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .pending { opacity: 0.5; font-style: italic; }

        @media (max-width: 600px) { .sidebar-servers { display: none; } .sidebar-channels { left: 0; } .main-chat { left: 240px; } }
    </style>
</head>
<body>

    <div class="sidebar-servers">
        <div class="server-icon" title="主服务器">🎮</div>
        <div style="width: 32px; height: 2px; background: #35363c; margin-bottom: 8px;"></div>
        <div class="server-icon" style="background:#35363c; border-radius: 50%;">🧪</div>
    </div>

    <div class="sidebar-channels">
        <div class="channel-header">🚀 JR 开发实验室</div>
        <div class="channel-list" id="channel-container">
            <div class="channel-category">文字频道</div>
            <div class="channel-item active" onclick="switchChannel('general', this)">
                <span class="hash">#</span> 💬-综合交流
            </div>
            <div class="channel-item" onclick="switchChannel('update', this)">
                <span class="hash">#</span> 🛠️-更新日志
            </div>
            <div class="channel-item" onclick="switchChannel('secret', this)">
                <span class="hash">#</span> 🤫-私密频道
            </div>
        </div>
        <div class="profile-bar">
            <div class="avatar" id="my-avatar">JR</div>
            <div style="margin-left: 8px; flex: 1; overflow: hidden;">
                <div style="font-size: 13px; font-weight: bold;" id="my-name">JR Official</div>
                <div style="font-size: 10px; color: var(--text-gray);">在线</div>
            </div>
            <button onclick="changeName()" style="background:none; border:none; cursor:pointer; font-size:16px;">⚙️</button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <span style="color: var(--text-gray); font-size: 22px; margin-right: 8px; font-weight: 300;">#</span>
            <span id="current-title">💬-综合交流</span>
        </div>
        
        <div class="chat-scroller" id="scroller">
            <div id="welcome-msg" style="margin-bottom: 30px; padding-top: 20px;">
                <div style="width: 68px; height: 68px; background: #41434a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 12px;">#</div>
                <h1 style="font-size: 30px; font-weight: 800;">欢迎来到 #<span id="welcome-name">💬-综合交流</span>！</h1>
                <p style="color: var(--text-gray); margin-top: 8px;">这是该频道的起点。消息将同步至对应的 Discord Webhook。</p>
            </div>
            <div id="msg-flow"></div>
        </div>

        <div class="input-wrapper">
            <form id="send-form" class="input-field">
                <input type="text" id="msg-input" placeholder="向 #💬-综合交流 发送消息" required>
                <button type="submit" class="btn-send">发送</button>
            </form>
        </div>
    </div>

    <script>
        // --- 核心配置：在这里配置不同的 Webhook ---
        const CHANNEL_CONFIG = {
            'general': {
                name: 'ZZH Server Pro',
                webhook: 'https://discord.com/api/webhooks/1505096198275731467/ree5y53JMM99S7dcCMqqW4_84Qumo26r0bG-a78bbocWbFNM0pSlGKu6-egUQdiNEwq8'
            },
            'update': {
                name: 'ZZH Server Plus',
                webhook: 'https://discord.com/api/webhooks/1505102286777614419/vDpkL0b0Fapf5nmxf9iRXAVu9ETWRAS01j_FkT0JaSphnkeayYEudIBpSo4c1fXYVoWl' // 换成第二个
            },
            'secret': {
                name: 'Only For Test',
                webhook: 'https://discord.com/api/webhooks/1505102727326203996/TPc4DYANVopgOygc3UuSERj-lul2x6uT9xh00njNPP8Sg4SlEc_A79AzxSOAZe7kZMYd' // 换成第三个
            }
        };

        let activeId = 'general';
        let userName = localStorage.getItem('dc_username_v4') || "JR Official";

        function init() {
            document.getElementById('my-name').innerText = userName;
            document.getElementById('my-avatar').innerText = userName.substring(0,2).toUpperCase();
        }

        function changeName() {
            const n = prompt("设置你在 Discord 显示的昵称:", userName);
            if(n) { userName = n; localStorage.setItem('dc_username_v4', n); init(); }
        }

        // 切换频道逻辑
        function switchChannel(id, el) {
            activeId = id;
            const config = CHANNEL_CONFIG[id];
            
            // UI 切换
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            document.getElementById('current-title').innerText = config.name;
            document.getElementById('welcome-name').innerText = config.name;
            document.getElementById('msg-input').placeholder = `向 #${config.name} 发送消息`;
            
            // 清空当前消息流（因为 Webhook 无法拉取历史记录，切换频道时刷新视图）
            document.getElementById('msg-flow').innerHTML = '';
        }

        function renderMsg(user, text, isPending = false) {
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const div = document.createElement('div');
            div.className = `msg-group ${isPending ? 'pending' : ''}`;
            div.innerHTML = `
                <div class="avatar" style="width:40px; height:40px; font-size:14px;">${user.substring(0,2).toUpperCase()}</div>
                <div class="msg-body">
                    <div class="msg-meta"><span class="msg-user">${user}</span><span class="msg-time">今天 ${time}</span></div>
                    <div class="msg-text">${text}</div>
                </div>
            `;
            document.getElementById('msg-flow').appendChild(div);
            const s = document.getElementById('scroller');
            s.scrollTop = s.scrollHeight;
            return div;
        }

        document.getElementById('send-form').onsubmit = async (e) => {
            e.preventDefault();
            const inp = document.getElementById('msg-input');
            const content = inp.value.trim();
            if(!content) return;

            const targetWebhook = CHANNEL_CONFIG[activeId].webhook;
            const msgEl = renderMsg(userName, content, true);
            inp.value = '';

            try {
                const res = await fetch(targetWebhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: userName, content: content })
                });
                if(res.ok) msgEl.classList.remove('pending');
            } catch(e) { 
                alert("发送失败，请确认该频道的 Webhook 已正确配置。"); 
            }
        }

        init();
    </script>
</body>
</html>
