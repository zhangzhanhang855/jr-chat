<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord 官方实时直连</title>
    <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css">
    <style>
        :root {
            --bg-servers: #1e1f22;
            --bg-channels: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
        }
        body { background-color: var(--bg-servers); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        /* 修复侧边栏布局高度 */
        .sidebar-height { height: 100vh; }
        
        /* 适配 iPad/手机的滚动条 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 10px; }

        /* 统一输入框样式 */
        .dc-input-container {
            background-color: var(--bg-input);
            border-radius: 8px;
            padding: 10px 16px;
            margin: 0 16px 24px 16px;
        }

        /* 频道点击状态 */
        .channel-active { background-color: #3f4147; color: white; }
        .channel-hover:hover { background-color: #35373c; color: #dbdee1; }
    </style>
</head>
<body class="flex sidebar-height overflow-hidden">

    <div class="w-18 flex-shrink-0 flex flex-col items-center py-3 space-y-3" style="background-color: var(--bg-servers); width: 72px;">
        <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center cursor-pointer shadow-xl text-xl">🎮</div>
        <div class="w-8 h-0.5 bg-gray-800 rounded"></div>
        <div class="w-12 h-12 bg-gray-700 rounded-3xl flex items-center justify-center opacity-50 cursor-not-allowed">🤖</div>
    </div>

    <div class="w-60 flex-shrink-0 flex flex-col" style="background-color: var(--bg-channels); width: 240px;">
        <div class="h-12 flex items-center px-4 font-bold border-b border-black border-opacity-20 shadow-sm text-white">
            🚀 线上开发连通群
        </div>
        
        <div class="flex-1 overflow-y-auto pt-4 px-2 space-y-1">
            <div class="text-xs font-bold text-gray-500 px-2 py-2 uppercase tracking-tighter">文字频道</div>
            <div class="flex items-center px-2 py-1.5 rounded channel-active cursor-pointer text-sm">
                <span class="text-gray-400 text-xl mr-2 font-light">#</span> 🔗-文字同步直连
            </div>
            <div class="flex items-center px-2 py-1.5 rounded channel-hover text-gray-400 cursor-not-allowed text-sm">
                <span class="text-gray-500 text-xl mr-2 font-light">#</span> 💬-灌水闲聊区
            </div>
        </div>

        <div class="h-14 px-2 flex items-center justify-between" style="background-color: #232428;">
            <div class="flex items-center space-x-2 overflow-hidden">
                <div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-xs" id="user-avatar">JR</div>
                <div class="truncate">
                    <div class="text-sm font-bold text-white truncate" id="user-display-name">JR Official</div>
                    <div class="text-[10px] text-gray-400 leading-none">#在线</div>
                </div>
            </div>
            <button onclick="changeNickname()" class="text-gray-400 hover:text-white p-1">⚙️</button>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-w-0" style="background-color: var(--bg-chat);">
        <div class="h-12 flex items-center px-4 border-b border-black border-opacity-20 shadow-sm flex-shrink-0">
            <span class="text-2xl text-gray-500 font-light mr-2">#</span>
            <span class="font-bold text-white">🔗-文字同步直连</span>
            <div class="ml-auto flex space-x-4 text-gray-400">
                <span>🔔</span><span>📌</span><span>👥</span>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto p-4 space-y-6 custom-scroll" id="chat-scroller">
            <div class="pb-6 border-b border-gray-700 border-opacity-30">
                <div class="w-16 h-16 bg-gray-600 rounded-full flex items-center justify-center text-4xl mb-4">#</div>
                <h1 class="text-3xl font-bold text-white">欢迎来到 #🔗-文字同步直连！</h1>
                <p class="text-gray-400 mt-2">这是该频道的历史开端。发送的消息会实时同步到 Discord。</p>
            </div>
            <div id="message-container" class="space-y-5"></div>
        </main>

        <div class="flex-shrink-0">
            <form id="chat-form" class="dc-input-container flex items-center space-x-3">
                <div class="w-6 h-6 bg-gray-500 rounded-full flex items-center justify-center text-white font-bold cursor-pointer hover:bg-gray-400">+</div>
                <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="向 #🔗-文字同步直连 发送消息" 
                    class="bg-transparent flex-1 text-sm text-gray-100 focus:outline-none placeholder-gray-500"
                    autocomplete="off"
                >
                <div class="flex space-x-2 text-xl grayscale hover:grayscale-0 cursor-pointer">
                    <span>🎁</span><span>😀</span>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1505096198275731467/ree5y53JMM99S7dcCMqqW4_84Qumo26r0bG-a78bbocWbFNM0pSlGKu6-egUQdiNEwq8";
        
        let myUsername = localStorage.getItem('dc_real_username') || "JR Official";
        const messageContainer = document.getElementById('message-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatScroller = document.getElementById('chat-scroller');

        function updateUI() {
            document.getElementById('user-display-name').innerText = myUsername;
            document.getElementById('user-avatar').innerText = myUsername.substring(0, 2).toUpperCase();
        }

        function changeNickname() {
            const name = prompt("修改昵称：", myUsername);
            if (name) { myUsername = name; localStorage.setItem('dc_real_username', name); updateUI(); }
        }

        function appendMessage(user, text, isPending = false) {
            const now = new Date();
            const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            const div = document.createElement('div');
            div.className = `flex space-x-4 group ${isPending ? 'opacity-40' : ''}`;
            div.innerHTML = `
                <div class="w-10 h-10 bg-blue-500 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white">${user.substring(0, 2).toUpperCase()}</div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-baseline space-x-2">
                        <span class="font-bold text-white hover:underline cursor-pointer">${user}</span>
                        <span class="text-[10px] text-gray-500">今天 ${time}</span>
                    </div>
                    <div class="text-sm text-gray-300 mt-0.5 leading-relaxed break-words">${text.replace(/\n/g, '<br>')}</div>
                </div>
            `;
            messageContainer.appendChild(div);
            chatScroller.scrollTo({ top: chatScroller.scrollHeight, behavior: 'smooth' });
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(myUsername, text, true);
            chatInput.value = '';

            try {
                const res = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: myUsername, content: text })
                });
                if (res.ok) messageContainer.lastElementChild.classList.remove('opacity-40');
            } catch (err) {
                alert("发送失败，请检查网络");
            }
        });

        updateUI();
    </script>
</body>
</html>
