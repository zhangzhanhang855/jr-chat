<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord 官方联动终端</title>
    <style>
        /* 1. 核心配色方案 */
        :root {
            --bg-darker: #1e1f22;  /* 服务器栏 */
            --bg-medium: #2b2d31;  /* 频道栏 */
            --bg-chat: #313338;    /* 聊天区 */
            --bg-input: #383a40;   /* 输入框 */
            --brand: #5865f2;      /* Discord 蓝 */
            --text-white: #ffffff;
            --text-gray: #b5bac1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-darker); overflow: hidden; height: 100vh; width: 100vw; }

        /* 2. 绝对定位三栏布局 - 确保在 iPad 上永不乱序 */
        .sidebar-servers { position: absolute; left: 0; top: 0; bottom: 0; width: 72px; background: var(--bg-darker); display: flex; flex-direction: column; items: center; py: 12px; z-index: 30; }
        .sidebar-channels { position: absolute; left: 72px; top: 0; bottom: 0; width: 240px; background: var(--bg-medium); display: flex; flex-direction: column; z-index: 20; border-top-left-radius: 8px; }
        .main-chat { position: absolute; left: 312px; right: 0; top: 0; bottom: 0; background: var(--bg-chat); display: flex; flex-direction: column; z-index: 10; }

        /* 移动端/小屏幕适配：如果屏幕太窄，隐藏左侧服务器栏 */
        @media (max-width: 768px) {
            .sidebar-servers { display: none; }
            .sidebar-channels { left: 0; }
            .main-chat { left: 240px; }
        }

        /* 3. 装饰组件 */
        .server-icon { width: 48px; height: 48px; background: var(--brand); border-radius: 16px; margin-top: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .server-icon:hover { border-radius: 12px; }

        .channel-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: bold; color: white; border-bottom: 1px solid rgba(0,0,0,0.2); font-size: 15px; }
        .channel-item { margin: 2px 8px; padding: 6px 8px; border-radius: 4px; color: var(--text-gray); display: flex; align-items: center; cursor: pointer; font-size: 14px; }
        .channel-item.active { background: rgba(255,255,255,0.06); color: white; }
        .channel-item:hover { background: rgba(255,255,255,0.03); }

        .profile-bar { position: absolute; bottom: 0; width: 100%; height: 52px; background: #232428; display: flex; align-items: center; padding: 0 8px; }
        .avatar { width: 32px; height: 32px; background: var(--brand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }

        .chat-header { height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(0,0,0,0.2); font-weight: bold; color: white; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message-row { display: flex; margin-bottom: 18px; line-height: 1.4; }
        .msg-content { margin-left: 16px; flex: 1; }
        .msg-user { color: white; font-weight: 600; font-size: 15px; margin-right: 8px; }
        .msg-time { color: var(--text-gray); font-size: 11px; }
        .msg-text { color: #dbdee1; font-size: 14px; margin-top: 2px; white-space: pre-wrap; }

        .input-area { padding: 0 16px 24px 16px; }
        .input-box { background: var(--bg-input); border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; }
        .input-box input { background: transparent; border: none; color: white; outline: none; flex: 1; font-size: 14px; }
        
        .btn-send { background: var(--brand); color: white; border: none; padding: 4px 12px; border-radius: 3px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .btn-send:hover { background: #4752c4; }

        .pending { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="sidebar-servers">
        <div class="server-icon">🎮</div>
        <div style="width: 32px; height: 2px; background: #35363c; margin: 8px 0;"></div>
        <div class="server-icon" style="background:#35363c; border-radius: 50%;">🤖</div>
    </div>

    <div class="sidebar-channels">
        <div class="channel-header">🚀 线上开发连通群</div>
        <div style="flex: 1; padding-top: 12px;">
            <div class="channel-item active">
                <span style="font-size: 20px; margin-right: 6px; color: #80848e;">#</span> 🔗-文字同步直连
            </div>
            <div class="channel-item">
                <span style="font-size: 20px; margin-right: 6px; color: #80848e;">#</span> 💬-灌水闲聊区
            </div>
        </div>
        <div class="profile-bar">
            <div class="avatar" id="avatar-icon">JR</div>
            <div style="margin-left: 8px; flex: 1; overflow: hidden;">
                <div style="font-size: 13px; font-weight: bold; color: white;" id="name-display">JR Official</div>
                <div style="font-size: 10px; color: var(--text-gray);">#在线</div>
            </div>
            <button onclick="editName()" style="background:none; border:none; cursor:pointer; font-size:16px;">⚙️</button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <span style="color: var(--text-gray); font-size: 22px; margin-right: 8px;">#</span> 🔗-文字同步直连
        </div>
        
        <div class="chat-messages" id="scroller">
            <div style="margin-bottom: 30px;">
                <div style="width: 68px; height: 68px; background: #41434a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 12px;">#</div>
                <h1 style="font-size: 30px; font-weight: 800; color: white;">欢迎来到 #🔗-文字同步直连！</h1>
                <p style="color: var(--text-gray); margin-top: 8px;">这是该频道的历史开端。你发送的消息将同步到 Discord 官方服务器。</p>
            </div>
            <div id="msg-list"></div>
        </div>

        <div class="input-area">
            <form id="chat-form" class="input-box">
                <span style="font-size: 20px; color: var(--text-gray); margin-right: 12px; cursor: pointer;">+</span>
                <input type="text" id="chat-input" placeholder="向 #🔗-文字同步直连 发送消息" required>
                <button type="submit" class="btn-send">发送</button>
            </form>
        </div>
    </div>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1505096198275731467/ree5y53JMM99S7dcCMqqW4_84Qumo26r0bG-a78bbocWbFNM0pSlGKu6-egUQdiNEwq8";
        
        let userName = localStorage.getItem('dc_user_v3') || "JR Official";

        function refreshUI() {
            document.getElementById('name-display').innerText = userName;
            document.getElementById('avatar-icon').innerText = userName.substring(0,2).toUpperCase();
        }

        function editName() {
            const n = prompt("输入新昵称:", userName);
            if(n) { userName = n; localStorage.setItem('dc_user_v3', n); refreshUI(); }
        }

        function pushMsg(user, text, isPending = false) {
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const div = document.createElement('div');
            div.className = `message-row ${isPending ? 'pending' : ''}`;
            div.innerHTML = `
                <div class="avatar" style="width:40px; height:40px; font-size:14px;">${user.substring(0,2).toUpperCase()}</div>
                <div class="msg-content">
                    <div><span class="msg-user">${user}</span><span class="msg-time">今天 ${time}</span></div>
                    <div class="msg-text">${text}</div>
                </div>
            `;
            document.getElementById('msg-list').appendChild(div);
            const s = document.getElementById('scroller');
            s.scrollTop = s.scrollHeight;
        }

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const inp = document.getElementById('chat-input');
            const val = inp.value.trim();
            if(!val) return;

            pushMsg(userName, val, true);
            const currentMsg = document.getElementById('msg-list').lastElementChild;
            inp.value = '';

            try {
                const res = await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: userName, content: val })
                });
                if(res.ok) currentMsg.classList.remove('pending');
            } catch(e) { alert("网络错误，发送失败"); }
        }

        refreshUI();
    </script>
</body>
</html>
