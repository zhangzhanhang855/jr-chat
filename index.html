<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时在线聊天室</title>
    <!-- 引入 Tailwind CSS 用于美化 UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Supabase 客户端 JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between font-sans">

    <!-- 顶部导航栏 -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">🌐 公共实时聊天室</h1>
        <div id="user-tag" class="text-xs bg-blue-700 px-3 py-1 rounded-full">正在连接...</div>
    </header>

    <!-- 聊天内容区域 -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl w-full mx-auto">
        <!-- 欢迎消息 -->
        <div class="flex justify-center">
            <span class="bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full shadow-sm">
                欢迎来到聊天室！请理性发言。
            </span>
        </div>
    </main>

    <!-- 底部输入区域 -->
    <footer class="bg-white p-4 border-t border-gray-200 shadow-lg">
        <form id="message-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="message-input" 
                placeholder="输入消息..." 
                required
                autocomplete="off"
                class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            >
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg shadow-md transition-colors duration-200"
            >
                发送
            </button>
        </form>
    </footer>

    <script>
        // ================= 配置区域 =================
        // 请替换为您自己的 Supabase 项目 URL 和 Anon Key
        const SUPABASE_URL = "https://hetldktquzyqlgkzuifi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhldGxka3RxdXp5cWxna3p1aWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MDc2NDYsImV4cCI6MjA5NDQ4MzY0Nn0.qFULlbCany8PBZ1kUO5O-xGzxvnyFLWuGkyj7mSaRQ8";
        // ============================================

        // 初始化 Supabase 客户端
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 随机生成当前用户的昵称
        const myUsername = "用户_" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('user-tag').innerText = `我的身份: ${myUsername}`;

        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');

        // 渲染消息到界面的函数
        function appendMessage(username, text, isMe = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

            msgDiv.innerHTML = `
                <span class="text-xs text-gray-500 mb-1 px-1">${username}</span>
                <div class="max-w-[75%] p-3 rounded-2xl shadow-sm text-sm ${
                    isMe 
                    ? 'bg-blue-600 text-white rounded-tr-none' 
                    : 'bg-white text-gray-800 border border-gray-200 rounded-tl-none'
                }">
                    ${escapeHTML(text)}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            // 滚动到底部
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 防止 XSS 攻击的转义函数
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 1. 初始化并订阅 Supabase 实时广播通道 (Broadcast)
        const channel = supabase.channel('room-1', {
            config: { broadcast: { self: true } } // self: true 表示自己发送的消息也会被接收
        });

        channel
            .on('broadcast', { event: 'shout' }, (payload) => {
                const { username, text } = payload.payload;
                const isMe = username === myUsername;
                appendMessage(username, text, isMe);
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    document.getElementById('user-tag').classList.add('bg-green-600');
                    document.getElementById('user-tag').innerText = `🟢 在线: ${myUsername}`;
                }
            });

        // 2. 监听表单提交（发送消息）
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // 通过广播通道将消息发送给所有在线用户
            await channel.send({
                type: 'broadcast',
                event: 'shout',
                payload: { username: myUsername, text: text }
            });

            // 清空输入框并聚焦
            messageInput.value = '';
            messageInput.focus();
        });
    </script>
</body>
</html>
