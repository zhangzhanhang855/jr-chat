<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord 官方联动镜像版</title>
    <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css">
    <style>
        .discord-dark { background-color: #36393f; }
        .discord-channels { background-color: #2f3136; }
        .discord-servers { background-color: #202225; }
        .discord-input { background-color: #40444b; }
    </style>
</head>
<body class="h-screen flex overflow-hidden font-sans select-none discord-dark text-white">

    <!-- 1. 左侧：服务器图标 -->
    <div class="discord-servers w-18 flex flex-col items-center py-3 space-y-2 flex-shrink-0">
        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center cursor-pointer shadow-lg">
            <span class="text-xl font-bold">🎮</span>
        </div>
    </div>

    <!-- 2. 左二：群频道列表 -->
    <div class="discord-channels w-60 flex flex-col flex-shrink-0">
        <div class="h-12 border-b border-gray-900 flex items-center px-4 font-bold shadow-sm">
            📡 官方实时联动群
        </div>
        <div class="flex-1 overflow-y-auto pt-3 px-2">
            <div class="flex items-center px-2 py-2 rounded text-white bg-gray-700 cursor-pointer">
                <span class="text-xl text-gray-400 mr-1.5">#</span> 🔗-文字同步直连
            </div>
        </div>
        <!-- 底部个人信息 -->
        <div class="bg-gray-900 p-3 h-14 flex items-center justify-between text-xs">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center font-bold" id="user-avatar">我</div>
                <div>
                    <div class="font-bold" id="user-display-name">加载中...</div>
                    <div class="text-gray-500">#7777</div>
                </div>
            </div>
            <button onclick="changeNickname()" class="text-gray-400 hover:text-white">⚙️</button>
        </div>
    </div>

    <!-- 3. 右侧：聊天主界面 -->
    <div class="flex-1 flex flex-col discord-dark min-w-0">
        <div class="h-12 border-b border-gray-900 flex items-center px-4 shadow-sm space-x-2 flex-shrink-0">
            <span class="text-2xl text-gray-400">#</span>
            <span class="font-bold text-sm">🔗-文字同步直连</span>
            <span class="text-xs text-green-400 border-l border-gray-700 pl-3">🟢 官方 Webhook 通道已就绪</span>
        </div>

        <!-- 消息历史滚动区 -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-scroller">
            <div class="pt-6 pb-2">
                <h2 class="text-3xl font-bold mb-1">欢迎来到官方联动频道！</h2>
                <p class="text-gray-400 text-sm">在此页面发送的每一条消息，都会在你的真实 Discord 群里同步显现！</p>
            </div>
            <div id="message-container" class="space-y-4"></div>
        </main>

        <!-- 输入框区域 -->
        <footer class="p-4 pt-0 flex-shrink-0">
            <form id="chat-form" class="discord-input rounded-lg px-4 py-2.5 flex items-center space-x-3 shadow-inner">
                <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="向真实 Discord 频道发送消息..." 
                    required
                    autocomplete="off"
                    class="bg-transparent flex-1 text-sm text-gray-200 focus:outline-none placeholder-gray-500"
                >
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1.5 rounded transition-all">发送至DC</button>
            </form>
        </footer>
    </div>

    <script>
        // 配置：在此处粘贴你从 Discord 频道复制的真正 Webhook 链接
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1505096198275731467/ree5y53JMM99S7dcCMqqW4_84Qumo26r0bG-a78bbocWbFNM0pSlGKu6-egUQdiNEwq8";

        let myUsername = localStorage.getItem('dc_real_username') || "DC旅者_" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('dc_real_username', myUsername);

        const messageContainer = document.getElementById('message-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatScroller = document.getElementById('chat-scroller');

        function updateProfileUI() {
            document.getElementById('user-display-name').innerText = myUsername;
            document.getElementById('user-avatar').innerText = myUsername.substring(0, 2);
        }

        function changeNickname() {
            const name = prompt("修改你在镜像站的用户名（发送至Discord时显示的发射者名称）：", myUsername);
            if (name && name.trim()) {
                myUsername = name.trim();
                localStorage.setItem('dc_real_username', myUsername);
                updateProfileUI();
            }
        }

        function appendDOMMessage(user, text, time, isPending = false) {
            const div = document.createElement('div');
            div.className = `flex items-start space-x-4 p-1 px-2 -mx-2 rounded transition-colors ${isPending ? 'opacity-50' : ''}`;
            
            div.innerHTML = `
                <div class="w-10 h-10 bg-indigo-600 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-sm text-gray-200 shadow">
                    ${user.substring(0, 2)}
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-baseline space-x-2 mb-0.5">
                        <span class="font-medium text-sm text-white hover:underline cursor-pointer">${user}</span>
                        <span class="text-xs text-gray-500">${time}</span>
                    </div>
                    <p class="text-sm break-words text-gray-300 leading-relaxed">${escapeHTML(text)}</p>
                </div>
            `;
            messageContainer.appendChild(div);
            chatScroller.scrollTop = chatScroller.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // 发送消息联动至 Discord 官方服务器
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            if (DISCORD_WEBHOOK_URL === "YOUR_DISCORD_WEBHOOK_URL") {
                alert("请先在 index.html 代码中配置你的 DISCORD_WEBHOOK_URL 后再部署测试！");
                return;
            }

            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            // 先在网页本地前端渲染一条“发送中”的消息
            appendDOMMessage(myUsername, text, timeStr, true);
            chatInput.value = '';

            // 核心：使用 fetch 异步调用 Discord Webhook API 核心协议
            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: myUsername, // 伪装成当前网页设置的用户名
                        content: text         // 消息文本内容
                    })
                });

                if (response.ok) {
                    console.log("消息成功同步至 Discord 群频道！");
                    // 刷新状态，将最后一条灰色等待消息变为正常高亮
                    renderSuccessState();
                } else {
                    alert("Discord 拦截了此消息，请检查 Webhook 状态。代码：" + response.status);
                }
            } catch (error) {
                console.error("网络异常，发送失败:", error);
                alert("发送失败，请确认 Vercel 是否能连接外部 API 或网络无代理拦截");
            }
        });

        function renderSuccessState() {
            const lastMsg = messageContainer.lastElementChild;
            if (lastMsg) lastMsg.classList.remove('opacity-50');
        }

        updateProfileUI();
    </script>
</body>
</html>
