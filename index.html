<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时在线聊天室</title>
    <!-- 使用 unpkg 镜像引入 Tailwind CSS，避免 jsdelivr 抽风 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4" crossorigin="anonymous"></script>
    <!-- 使用 cdnjs 官方镜像引入 Supabase 客户端，稳定性更佳 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.43.4/supabase.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between font-sans">

    <!-- 顶部导航栏 -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">🌐 公共实时聊天室</h1>
        <div id="user-tag" class="text-xs bg-amber-500 px-3 py-1 rounded-full animate-pulse">正在连接服务器...</div>
    </header>

    <!-- 聊天内容区域 -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl w-full mx-auto">
        <!-- 欢迎消息 -->
        <div class="flex justify-center">
            <span class="bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full shadow-sm">
                欢迎来到聊天室！本系统无需服务器，基于 Vercel + Supabase 实时广播构建。
            </span>
        </div>
    </main>

    <!-- 底部输入区域 -->
    <footer class="bg-white p-4 border-t border-gray-200 shadow-lg">
        <form id="message-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="message-input" 
                placeholder="输入消息内容..." 
                required
                autocomplete="off"
                class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            >
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg shadow-md transition-colors duration-200"
            >
                发送
            </button>
        </form>
    </footer>

    <script>
        // ==================== [请在此处配置你的密码] ====================
        const SUPABASE_URL = "https://hetldktquzyqlgkzuifi.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhldGxka3RxdXp5cWxna3p1aWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MDc2NDYsImV4cCI6MjA5NDQ4MzY0Nn0.qFULlbCany8PBZ1kUO5O-xGzxvnyFLWuGkyj7mSaRQ8"; 
        // =============================================================

        // 初始化检查，防止脚本未加载成功时崩溃
        if (typeof supabase === 'undefined') {
            alert('Supabase 脚本加载失败，请检查网络或刷新页面！');
        }

        // 初始化 Supabase 客户端
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 随机生成当前用户的匿名昵称
        const myUsername = "用户_" + Math.floor(1000 + Math.random() * 9000);
        
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const userTag = document.getElementById('user-tag');

        // 安全地将消息渲染到界面上（防止XSS脚本注入攻击）
        function appendMessage(username, text, isMe = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

            msgDiv.innerHTML = `
                <span class="text-xs text-gray-500 mb-1 px-1">${username} ${isMe ? '(我)' : ''}</span>
                <div class="max-w-[75%] p-3 rounded-2xl shadow-sm text-sm ${
                    isMe 
                    ? 'bg-blue-600 text-white rounded-tr-none' 
                    : 'bg-white text-gray-800 border border-gray-200 rounded-tl-none'
                }">
                    ${escapeHTML(text)}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // 滚动到最新消息
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 创建并订阅 Supabase 实时广播通道 (Broadcast)
        const channel = supabaseClient.channel('global-room', {
            config: { broadcast: { self: true } } // 允许接收自己发送的消息，方便统一渲染
        });

        channel
            .on('broadcast', { event: 'shout' }, (payload) => {
                const { username, text } = payload.payload;
                const isMe = username === myUsername;
                appendMessage(username, text, isMe);
            })
            .subscribe((status, err) => {
                console.log("Supabase 连接状态:", status);
                if (err) console.error("连接发生错误:", err);

                if (status === 'SUBSCRIBED') {
                    // 连接成功，改变顶部标签颜色
                    userTag.classList.remove('bg-amber-500', 'animate-pulse');
                    userTag.classList.add('bg-green-600');
                    userTag.innerText = `🟢 在线: ${myUsername}`;
                } else if (status === 'CHANNEL_ERROR' || status === 'CLOSED') {
                    userTag.classList.remove('bg-green-600', 'animate-pulse');
                    userTag.classList.add('bg-red-500');
                    userTag.innerText = `🔴 连接失败/断开`;
                }
            });

        // 监听表单发送事件
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // 通过 WebSocket 广播消息
            try {
                await channel.send({
                    type: 'broadcast',
                    event: 'shout',
                    payload: { username: myUsername, text: text }
                });
                messageInput.value = '';
                messageInput.focus();
            } catch (error) {
                console.error("消息发送失败:", error);
                alert("发送失败，请检查网络连接");
            }
        });
    </script>
</body>
</html>
