<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时在线聊天室</title>
    
    <!-- 1. 样式文件：采用可以安全下载的 Tailwind CSS 样式 -->
    <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css">
    
    <!-- 2. 核心脚本：采用字节跳动国内高稳定 CDN 节点，绝不会加载失败 -->
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/supabase-js/1.30.0/supabase-js.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between font-sans">

    <!-- 顶部导航栏 -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">🌐 公共实时聊天室</h1>
        <div id="user-tag" class="text-xs bg-yellow-500 px-3 py-1 rounded-full">正在连接服务器...</div>
    </header>

    <!-- 聊天内容区域 -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-center">
            <span class="bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full shadow-sm">
                欢迎来到聊天室！本系统已启用国内加速骨干网。
            </span>
        </div>
    </main>

    <!-- 底部输入区域 -->
    <footer class="bg-white p-4 border-t border-gray-200 shadow-lg">
        <form id="message-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="message-input" 
                placeholder="输入消息内容..." 
                required
                autocomplete="off"
                class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            >
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg shadow-md transition-all"
            >
                发送
            </button>
        </form>
    </footer>

    <script>
        // 配置数据（已为您自动填妥）
        const SUPABASE_URL = "https://hetldktquzyqlgkzuifi.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhldGxka3RxdXp5cWxna3p1aWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MDc2NDYsImV4cCI6MjA5NDQ4MzY0Nn0.qFULlbCany8PBZ1kUO5O-xGzxvnyFLWuGkyj7mSaRQ8"; 

        // 终极兼容性检查
        const supabaseProvider = window.supabase || (window.supabaseJS ? window.supabaseJS : null);
        
        if (!supabaseProvider) {
            document.getElementById('user-tag').className = "text-xs bg-red-600 px-3 py-1 rounded-full";
            document.getElementById('user-tag').innerText = "❌ 脚本受阻，请直接部署至Vercel测试";
            alert('本地网络严格限制了外部脚本。请不要双击打开，直接把此文件上传到 Vercel 部署，线上环境会自动通行！');
        }

        // 初始化 Supabase 客户端 (兼容老版本镜像语法)
        const supabaseClient = supabaseProvider.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 随机生成当前用户的匿名昵称
        const myUsername = "用户_" + Math.floor(1000 + Math.random() * 9000);
        
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const userTag = document.getElementById('user-tag');

        function appendMessage(username, text, isMe = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-4`;

            msgDiv.innerHTML = `
                <span class="text-xs text-gray-500 mb-1 px-1">${username} ${isMe ? '(我)' : ''}</span>
                <div class="max-w-[75%] p-3 rounded-xl shadow-sm text-sm ${
                    isMe 
                    ? 'bg-blue-600 text-white rounded-tr-none' 
                    : 'bg-white text-gray-800 border border-gray-200 rounded-tl-none'
                }">
                    ${escapeHTML(text)}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // 订阅广播通道
        const channel = supabaseClient.channel('global-room', {
            config: { broadcast: { self: true } }
        });

        channel
            .on('broadcast', { event: 'shout' }, (payload) => {
                const { username, text } = payload.payload;
                appendMessage(username, text, username === myUsername);
            })
            .subscribe((status) => {
                console.log("连接状态:", status);
                if (status === 'SUBSCRIBED') {
                    userTag.className = "text-xs bg-green-600 px-3 py-1 rounded-full";
                    userTag.innerText = `🟢 在线: ${myUsername}`;
                }
            });

        // 发送消息
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            try {
                await channel.send({
                    type: 'broadcast',
                    event: 'shout',
                    payload: { username: myUsername, text: text }
                });
                messageInput.value = '';
                messageInput.focus();
            } catch (error) {
                alert("发送失败，请刷新重试");
            }
        });
    </script>
</body>
</html>
