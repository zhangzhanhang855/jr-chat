<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时在线聊天室</title>
    <!-- 仅引入基础 CSS 样式 -->
    <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between font-sans">

    <!-- 顶部导航栏 -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">🌐 公共实时聊天室</h1>
        <div id="user-tag" class="text-xs bg-yellow-500 px-3 py-1 rounded-full">正在连接服务器...</div>
    </header>

    <!-- 聊天内容区域 -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-center">
            <span class="bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full shadow-sm">
                欢迎来到聊天室！本系统采用原生 WebSocket 架构，连接更稳定。
            </span>
        </div>
    </main>

    <!-- 底部输入区域 -->
    <footer class="bg-white p-4 border-t border-gray-200 shadow-lg">
        <form id="message-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="message-input" 
                placeholder="输入消息内容..." 
                required
                autocomplete="off"
                class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            >
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg shadow-md transition-all"
            >
                发送
            </button>
        </form>
    </footer>

    <script>
        // 随机生成当前用户的匿名昵称
        const myUsername = "用户_" + Math.floor(1000 + Math.random() * 9000);
        
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const userTag = document.getElementById('user-tag');

        // 使用免费的公共 WebSocket 服务器，末尾的 chat-room-xyz 是你的房间名（可随意修改以防撞房）
        const socket = new WebSocket('wss://api.piesocket.com/v3/chat-room-xyz?api_key=VCXCEuvhGcBDP7XhiJJUDvR1e1D3clON7Heox9o6&notify_self=1');

        // 连接成功
        socket.onopen = () => {
            userTag.className = "text-xs bg-green-600 px-3 py-1 rounded-full";
            userTag.innerText = `🟢 在线: ${myUsername}`;
        };

        // 接收消息
        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.username && data.text) {
                    appendMessage(data.username, data.text, data.username === myUsername);
                }
            } catch (e) {
                // 忽略非 JSON 格式的系统广播
            }
        };

        // 连接断开
        socket.onclose = () => {
            userTag.className = "text-xs bg-red-500 px-3 py-1 rounded-full";
            userTag.innerText = `🔴 连接断开，请刷新`;
        };

        // 发生错误
        socket.onerror = (error) => {
            console.error("WebSocket 错误:", error);
            userTag.innerText = `❌ 连接异常`;
        };

        // 渲染消息
        function appendMessage(username, text, isMe = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-4`;

            msgDiv.innerHTML = `
                <span class="text-xs text-gray-500 mb-1 px-1">${username} ${isMe ? '(我)' : ''}</span>
                <div class="max-w-[75%] p-3 rounded-xl shadow-sm text-sm ${
                    isMe 
                    ? 'bg-blue-600 text-white rounded-tr-none' 
                    : 'bg-white text-gray-800 border border-gray-200 rounded-tl-none'
                }">
                    ${escapeHTML(text)}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // 发送消息
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            if (socket.readyState !== WebSocket.OPEN) {
                alert("尚未连接到服务器，请稍后再试");
                return;
            }

            const payload = { username: myUsername, text: text };
            socket.send(JSON.stringify(payload));
            
            messageInput.value = '';
            messageInput.focus();
        });
    </script>
</body>
</html>
